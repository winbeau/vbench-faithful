# Relative paths are resolved from this YAML file's directory.
# Paths supplied as CLI overrides are resolved from the current directory.
version: 1
input: ../output/inputs.json
assets: ../output/runtime/assets.json

# Omit output to create a new ../output/eval/<UTC timestamp> directory per run.
# output: ../output/eval/my-run
# video_root: ${VBENCH_VIDEO_ROOT}

# ours runs nine selected repairs plus seven accelerated dimensions.
# official runs pinned original VBench; both compares all sixteen dimensions.
# Legacy aliases repair and origin remain accepted.
backend: ours
dimensions: all
gpus: [0]
cache_dir: ~/.cache/vbench-repair

# Omit env_dir to use the repository's .venvs/metrics directory.
# env_dir: ../.venvs/metrics
reuse: true
