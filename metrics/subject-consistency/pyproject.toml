[project]
name = "subject-consistency"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["audit-core", "audit-models", "numpy<2"]

[project.optional-dependencies]
models = [
  "decord",
  "opencv-python",
  "pillow",
  "torch",
  "torchvision",
  "tqdm",
]
[project.scripts]
subject-consistency = "subject_consistency.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
