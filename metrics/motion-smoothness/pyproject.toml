[project]
name = "motion-smoothness"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["audit-core", "audit-models", "numpy<2", "opencv-python"]

[project.optional-dependencies]
models = ["audit-models[models]", "imageio", "omegaconf"]
[project.scripts]
motion-smoothness = "motion_smoothness.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
