[project]
name = "aesthetic-quality"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["audit-core", "audit-models"]

[project.scripts]
aesthetic-quality = "aesthetic_quality.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
