[project]
name = "temporal-style"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["audit-core", "audit-models", "numpy<2"]

[project.optional-dependencies]
models = [
  "audit-models[models]",
  "decord",
  "einops",
  "ftfy",
  "pillow",
  "regex",
  "timm<=1.0.12",
  "torch",
  "torchvision",
  "tqdm",
  "transformers==4.33.2",
]

[project.scripts]
temporal-style = "temporal_style.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
