[project]
name = "spatial-relationship"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["audit-core", "numpy<2"]

[project.optional-dependencies]
models = [
  "boto3",
  "botocore",
  "decord",
  "easydict",
  "fvcore",
  "lvis",
  "opencv-python",
  "pillow",
  "requests",
  "torch",
  "torchvision",
  "tqdm",
  "timm<=1.0.12",
  "transformers==4.33.2",
]
[project.scripts]
spatial-relationship = "spatial_relationship.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
