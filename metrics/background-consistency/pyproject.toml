[project]
name = "background-consistency"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["audit-core", "audit-models", "numpy<2"]

[project.optional-dependencies]
models = [
  "audit-models[models]",
  "decord",
  "fairscale>=0.4.4",
  "open-clip-torch",
  "openai-clip",
  "pillow",
  "scipy",
  "timm<=1.0.12",
  "torch",
  "torchvision",
  "transformers==4.33.2",
]

[project.scripts]
background-consistency = "background_consistency.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
