[project]
name = "audit-core"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
