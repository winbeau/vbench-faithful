<!doctype html><meta charset="utf-8"><title>独立主体定位提示确认</title>
<style>body{font:16px system-ui;max-width:950px;margin:2rem auto}canvas{max-width:100%;border:1px solid #aaa;touch-action:none}button,input{font:inherit;margin:.4rem}#status{white-space:pre-wrap}</style>
<h1>独立评分定位提示</h1><p>只显示原片首帧。拖动一个主体框，填写审核人并确认。此框固定用于整段及其所有腐化版本；请勿参照建族掩码或分数。</p>
<p id="prompt"></p><canvas id="view"></canvas><p>审核人 <input id="reviewer" required> <button id="confirm">确认此片段</button></p>
<button id="prev">上一条</button><button id="next">下一条</button><button id="export">导出待冻结 JSONL</button><p id="status"></p>
<script>
const inputs = /*REVIEW_INPUTS*/[];
let index=0, box=null, start=null, image=new Image(); const answers={};
const canvas=document.getElementById('view'), ctx=canvas.getContext('2d'), status=document.getElementById('status');
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0);if(box){ctx.strokeStyle='#0f0';ctx.lineWidth=2;ctx.strokeRect(box[0],box[1],box[2]-box[0],box[3]-box[1]);}}
function show(){if(!inputs.length){status.textContent='没有通过构造条件的基底。定位提示尚不能确认。';return;}const row=inputs[index];document.getElementById('prompt').textContent=`${index+1}/${inputs.length}: ${row.prompt}`;box=answers[row.video_uid]?.box||null;canvas.height=row.image_size[0];canvas.width=row.image_size[1];image.onload=draw;image.src=row.image;status.textContent=`已确认 ${Object.keys(answers).length}/${inputs.length}`;}
function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(canvas.width,Math.round((e.clientX-r.left)*canvas.width/r.width))),Math.max(0,Math.min(canvas.height,Math.round((e.clientY-r.top)*canvas.height/r.height)))];}
canvas.onpointerdown=e=>{start=point(e);canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(start){let p=point(e);box=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])];draw();}};
canvas.onpointerup=()=>start=null;
document.getElementById('confirm').onclick=()=>{const name=document.getElementById('reviewer').value.trim();if(!name||!box||box[2]<=box[0]||box[3]<=box[1]){status.textContent='请填写审核人并画一个有效主体框。';return;}const row=inputs[index];answers[row.video_uid]={video_uid:row.video_uid,role:'scoring',prompt_source:'human_clean_frame',source_frame_sha256:row.source_frame_sha256,image_size:row.image_size,phrase:row.phrase,box:[...box],points:[],point_labels:[],human_confirmed:true,reviewer:name,confirmed_at:new Date().toISOString()};status.textContent=`已确认 ${Object.keys(answers).length}/${inputs.length}`;};
document.getElementById('prev').onclick=()=>{index=Math.max(0,index-1);show();};document.getElementById('next').onclick=()=>{index=Math.min(inputs.length-1,index+1);show();};
document.getElementById('export').onclick=()=>{const rows=inputs.map(r=>answers[r.video_uid]).filter(Boolean);if(!rows.length)return;const url=URL.createObjectURL(new Blob([rows.map(r=>JSON.stringify(r)).join('\n')+'\n'],{type:'application/x-ndjson'}));const a=document.createElement('a');a.href=url;a.download='localizer.reviewed.jsonl';a.click();URL.revokeObjectURL(url);};show();
</script>
