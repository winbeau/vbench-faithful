[project]
name = "vbench-audit"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "audit-core",
  "audit-models",
  "dynamic-degree",
  "motion-smoothness",
  "subject-consistency",
  "scene",
  "human-action",
  "spatial-relationship",
  "overall-consistency",
  "multiple-objects",
]

[dependency-groups]
dev = ["pytest>=8,<9"]
test = [
  "pytest>=8,<9",
  "numpy<2",
  "opencv-python<4.12",
  "scipy",
]

[project.optional-dependencies]
models = [
  "audit-models[models]",
  "dynamic-degree[models]",
  "motion-smoothness[models]",
  "subject-consistency[models]",
  "scene[models]",
  "human-action[models]",
  "spatial-relationship[models]",
  "overall-consistency[models]",
  "multiple-objects[models]",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["metrics/*", "packages/*"]

[tool.uv.sources]
audit-core = { workspace = true }
audit-models = { workspace = true }
dynamic-degree = { workspace = true }
motion-smoothness = { workspace = true }
subject-consistency = { workspace = true }
scene = { workspace = true }
human-action = { workspace = true }
spatial-relationship = { workspace = true }
overall-consistency = { workspace = true }
multiple-objects = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "metrics"]
addopts = ["--import-mode=importlib"]
