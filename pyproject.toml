[project]
name = "vbench-audit"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "audit-core",
  "audit-models",
  "vbench-prompts-compile",
  "dynamic-degree",
  "motion-smoothness",
  "subject-consistency",
  "scene",
  "human-action",
  "spatial-relationship",
  "overall-consistency",
  "multiple-objects",
  "background-consistency",
  "temporal-style",
  "object-class",
  "color",
  "aesthetic-quality",
  "imaging-quality",
  "temporal-flickering",
  "appearance-style",
]

[dependency-groups]
dev = ["pytest>=8,<9"]
test = [
  "pytest>=8,<9",
  "numpy<2",
  "opencv-python<4.12",
  "scipy",
]

[project.optional-dependencies]
models = [
  "audit-models[models]",
  "dynamic-degree[models]",
  "motion-smoothness[models]",
  "subject-consistency[models]",
  "scene[models]",
  "human-action[models]",
  "spatial-relationship[models]",
  "overall-consistency[models]",
  "multiple-objects[models]",
  "background-consistency[models]",
  "temporal-style[models]",
  "object-class[models]",
  "color[models]",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["metrics/*", "packages/*"]

[tool.uv.sources]
audit-core = { workspace = true }
audit-models = { workspace = true }
vbench-prompts-compile = { workspace = true }
dynamic-degree = { workspace = true }
motion-smoothness = { workspace = true }
subject-consistency = { workspace = true }
scene = { workspace = true }
human-action = { workspace = true }
spatial-relationship = { workspace = true }
overall-consistency = { workspace = true }
multiple-objects = { workspace = true }
background-consistency = { workspace = true }
temporal-style = { workspace = true }
object-class = { workspace = true }
color = { workspace = true }
aesthetic-quality = { workspace = true }
imaging-quality = { workspace = true }
temporal-flickering = { workspace = true }
appearance-style = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "metrics"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
