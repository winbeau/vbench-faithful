[project]
name = "dynamic-degree"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "audit-core",
  "easydict",
  "numpy<2",
  "opencv-python",
  "scipy",
  "torch",
  "tqdm",
]

[project.scripts]
dynamic-degree = "dynamic_degree.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
